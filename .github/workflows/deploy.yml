name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t ai-email-backend ./backend

      - name: Django system checks
        working-directory: backend
        env:
          SECRET_KEY: ci-dummy-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost
          GEMINI_API_KEY: ci-dummy
          PIPELINE_AUTOSTART: "False"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://example.onrender.com
          VITE_WS_URL: wss://example.onrender.com
        run: |
          npm ci
          npm run build

  deploy:
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Render frontend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
