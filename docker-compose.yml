services:
  backend:
    build: ./backend
    container_name: ai_email_backend
    # The ./backend bind mount below exposes the whole backend/ dir to the
    # container. For real Gmail mode, place credentials.json + token.json in
    # backend/ (generate token.json via `python manage.py gmail_auth` on the
    # host first) and they are picked up automatically. Both are gitignored.
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/notifications/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: ai_email_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: always